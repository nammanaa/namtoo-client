name: Build Minecraft Plugin JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Bước đổi tên tất cả file .jar tạo ra thành namtooclient.jar
      - name: Rename JAR file
        run: |
          cd build/libs
          mv *.jar namtooclient.jar

      # Tải file namtooclient.jar lên Artifacts
      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: namtooclient-jar
          path: build/libs/namtooclient.jar
